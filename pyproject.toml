[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-pipeline"
version = "0.1.0"
description = "Find, judge and assemble vertical Shorts from live-stream VODs, orchestrated with Claude."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = []            # standard library only; ffmpeg/ffprobe are external tools

[tool.setuptools.packages.find]
where = ["src"]
